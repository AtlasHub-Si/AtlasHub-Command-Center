name: Atlas Motion verification
on:
  pull_request:
  push:
    branches: [main, 'feat/living-background-standby']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/living-background.test.mjs
      - run: node --check public/living-background.js && node --check public/screen.js
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-living-background-v1
          path: public/
